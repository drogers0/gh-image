version: 2

builds:
  # Default provider: kooky. This is the binary `gh extension install` resolves.
  - id: kooky
    binary: gh-image
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
      - android
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 requires external (cgo) linking; we build with CGO_ENABLED=0.
      - goos: android
        goarch: amd64

  # Alternate provider: HackBrowserData (-tags hbd). Shipped as extra `hbd-*`
  # assets for manual download; `gh extension install` still gets the kooky build.
  # No android: HackBrowserData targets desktop browsers only.
  - id: hbd
    binary: gh-image
    main: .
    flags:
      - -tags=hbd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}-hbd
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - kooky
    formats:
      - binary
    name_template: "{{ .Os }}-{{ .Arch }}"
  - id: hbd
    ids:
      - hbd
    formats:
      - binary
    name_template: "hbd-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  # -rc / -beta tags are published as pre-releases, so `gh extension install`
  # keeps serving the stable line.
  prerelease: auto
  header: |
    Highlights since {{ .PreviousTag }}:

    - **Cookie provider is now build-tag-selectable** (#50): default `kooky`, or `-tags hbd` for [HackBrowserData](https://github.com/moonD4rk/HackBrowserData) — also shipped as alternate `hbd-<os>-<arch>` assets below. `gh extension install` still gets the default kooky binary.
    - **New `download` subcommand** for user-attachments URLs (#46).
    - Bearer-token upload is tried before the browser-session flow (#49).
    - SSO interstitial detection by org display name (#55); expired-session error fix (#45); content_type and Windows ABE/lock error hints (#33, #34).

    Full list below.
