version: 2

builds:
  # Default provider: kooky. This is the binary `gh extension install` resolves.
  - id: kooky
    binary: gh-image
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
      - android
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 requires external (cgo) linking; we build with CGO_ENABLED=0.
      - goos: android
        goarch: amd64

  # Alternate provider: HackBrowserData (-tags hbd). Shipped as extra `hbd-*`
  # assets for manual download; `gh extension install` still gets the kooky build.
  # No android: HackBrowserData targets desktop browsers only.
  - id: hbd
    binary: gh-image
    main: .
    flags:
      - -tags=hbd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}-hbd
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - kooky
    formats:
      - binary
    name_template: "{{ .Os }}-{{ .Arch }}"
  - id: hbd
    ids:
      - hbd
    formats:
      - binary
    name_template: "hbd-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  # -rc / -beta tags are published as pre-releases, so `gh extension install`
  # keeps serving the stable line.
  prerelease: auto
  header: |
    Highlights since {{ .PreviousTag }}:

    - **Fix: uploading several non-image files in one run** (#66). After the first file, GitHub serves the repository page in a variant that embeds the upload token as an unquoted property, so every later PDF, ZIP or other non-image file failed with a misleading "you may not have upload access" error. Both forms are now recognized. Image uploads were unaffected.
    - Dependency bump: goldmark 1.8.6 (#65).

    Full list below.
