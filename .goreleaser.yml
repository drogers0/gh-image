version: 2

builds:
  # Default provider: kooky. This is the binary `gh extension install` resolves.
  - id: kooky
    binary: gh-image
    main: .
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
      - android
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
      # android/amd64 requires external (cgo) linking; we build with CGO_ENABLED=0.
      - goos: android
        goarch: amd64

  # Alternate provider: HackBrowserData (-tags hbd). Shipped as extra `hbd-*`
  # assets for manual download; `gh extension install` still gets the kooky build.
  # No android: HackBrowserData targets desktop browsers only.
  - id: hbd
    binary: gh-image
    main: .
    flags:
      - -tags=hbd
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}-hbd
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    ids:
      - kooky
    formats:
      - binary
    name_template: "{{ .Os }}-{{ .Arch }}"
  - id: hbd
    ids:
      - hbd
    formats:
      - binary
    name_template: "hbd-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
